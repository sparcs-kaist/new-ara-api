[program:celery-worker]
command=celery -A ara worker -l info --concurrency=1
directory=/newara/www
stdout_logfile=/var/log/newara/celery-worker.log
stderr_logfile=/var/log/newara/celery-worker.log
numprocs=1

; 배달 알림 / 배달 마감 전용 (CELERY_TASK_ROUTES, apps/core/push.py)
[program:celery-worker-urgent]
command=celery -A ara worker -l info -Q urgent -n urgent@%%h --concurrency=2
directory=/newara/www
stdout_logfile=/var/log/newara/celery-worker-urgent.log
stderr_logfile=/var/log/newara/celery-worker-urgent.log
numprocs=1

; 채팅 / 댓글 푸시 전용
[program:celery-worker-push]
command=celery -A ara worker -l info -Q push -n push@%%h --concurrency=2
directory=/newara/www
stdout_logfile=/var/log/newara/celery-worker-push.log
stderr_logfile=/var/log/newara/celery-worker-push.log
numprocs=1
