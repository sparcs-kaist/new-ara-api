name: Run tests for new-ara-api
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
  release:
    types: [created]

env:
  PROJECT_NAME: newara
  GHCR_IMAGE: ghcr.io/sparcs-kaist/new-ara-api
  COMPOSE_PROJECT_NAME: newara-ci
  NEWARA_TEST_IMAGE: newara:test

jobs:
  deploy:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select image tag
        run: |
          . .github/workflows/generate-docker-tag.sh
          echo "PUSH=$PUSH" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"

      - name: Build production image
        run: docker build --target production -t "$PROJECT_NAME:production" .

      - name: Build test image
        run: docker build --target test -t "$NEWARA_TEST_IMAGE" .

      - name: Check production dependencies
        run: |
          docker run --rm --entrypoint python \
            -e DJANGO_ENV=production -e FCM_DISABLED=1 \
            -e LOG_FILE_PATH=/tmp/ara-check.log \
            "$PROJECT_NAME:production" manage.py check

      - name: Run tests
        run: docker compose -f docker-compose.test.yml run --rm api test

      - name: Clean up test services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push production image
        if: env.PUSH == 'true'
        run: |
          docker tag "$PROJECT_NAME:production" "$GHCR_IMAGE:$DOCKER_TAG"
          docker push "$GHCR_IMAGE:$DOCKER_TAG"
