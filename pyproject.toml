[project]
name = "new-ara-api"
version = "0.1.0"
description = "REST API for Ara, KAIST's community service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asgiref>=3.13.0,<4",
    "beautifulsoup4>=4.15.0,<5",
    "bleach>=6.4.0,<7",
    "boto3>=1.44.9,<2",
    "botocore>=1.44.9,<2",
    "celery>=5.7.0,<6",
    "channels>=4.3.2,<5",
    "channels-redis>=4.3.0,<5",
    "daphne>=4.2.3,<5",
    "django>=5.2.19,<5.3",
    "django-cacheops>=7.2,<8",
    "django-celery-beat>=2.9.0,<3",
    "django-celery-results>=2.6.0,<3",
    "django-cors-headers>=4.9.0,<5",
    "django-elasticsearch-dsl>=7.4,<8",
    "django-environ>=0.14.0,<0.15",
    "django-extensions>=4.1,<5",
    "django-filter>=26.2,<27",
    "django-redis>=7.0.0,<8",
    "django-s3-storage>=0.15.0,<0.16",
    "django-ses>=4.9.1,<5",
    "djangorestframework>=3.18.3,<4",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "drf-spectacular>=0.30.0,<0.31",
    "elasticsearch>=7.17.13,<8",
    "elasticsearch-dsl>=7.4.1,<8",
    "firebase-admin>=7.8.0,<8",
    "gunicorn>=27.0.1,<28",
    "html5lib>=1.1,<2",
    "lxml>=6.1.3,<7",
    "mysqlclient>=2.3.2,<3",
    "passlib>=1.9.5,<2",
    "pillow>=13.0.0,<14",
    "pydantic>=2.14.4,<3",
    "pyjwt>=2.15.1,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "python-dotenv>=1.2.4,<2",
    "pytz>=2026.6,<2027",
    "pyyaml>=6.0.4,<7",
    "requests>=2.34.2,<3",
    "redis>=8.1.0,<9",
    "sentry-sdk>=2.75.0,<3",
    "slack-sdk>=3.48.0,<4",
    "tqdm>=4.70.1,<5",
    "uritemplate>=4.2.0,<5",
]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "django-debug-toolbar>=8.0.0,<9",
    "ipython>=9.18.1,<10",
    "isort>=9.0.2,<10",
    "pre-commit>=4.7.0,<5",
    { include-group = "test" },
]
test = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-django>=4.14.0,<5",
]

[tool.uv]
package = false
required-version = ">=0.11.15,<0.14"

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"
py_version = 314
